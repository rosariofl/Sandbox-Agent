apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: sandbox-egress-vs
  namespace: sandbox
spec:
  hosts:
  - api.anthropic.com
  - 920425549926.dkr.ecr.us-west-1.amazonaws.com
  - api.ecr.us-west-1.amazonaws.com
  gateways:
  - mesh
  - istio-system/egress-gateway   # Notice the istio-system/ prefix!
  

  tls:
  # Anthropic API routes
  # Hop 1: Sandbox Pod Sidecar -> Egress Gateway (HTTPS)
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      - api.anthropic.com
    route:
    - destination:
        host: istio-egressgateway.istio-system.svc.cluster.local
        port:
          number: 443
  # Hop 2: Egress Gateway -> External api.anthropic.com (HTTPS)
  - match:
    - gateways:
      - istio-system/egress-gateway   # Notice the istio-system/ prefix!
      port: 443
      sniHosts:
      - api.anthropic.com
    route:
    - destination:
        host: api.anthropic.com
        port:
          number: 443


  # ECR API Routes  
  # Hop 1: Sandbox Pod Sidecar -> Egress Gateway (HTTPS)
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      - api.ecr.us-west-1.amazonaws.com
    route:
    - destination:
        host: istio-egressgateway.istio-system.svc.cluster.local
        port:
          number: 443
  # Hop 2: Egress Gateway -> External api.ecr.us-west-1.amazonaws.com (HTTPS)
  - match:
    - gateways:
      - istio-system/egress-gateway   # Notice the istio-system/ prefix!
      port: 443
      sniHosts:
      - api.ecr.us-west-1.amazonaws.com
    route:
    - destination:
        host: api.ecr.us-west-1.amazonaws.com
        port:
          number: 443

  # ECR routes  
  # Hop 1: Sandbox Pod Sidecar -> Egress Gateway (HTTPS)
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      - "*.dkr.ecr.us-west-1.amazonaws.com"
    route:
    - destination:
        host: istio-egressgateway.istio-system.svc.cluster.local
        port:
          number: 443
  # Hop 2: Egress Gateway -> External "*.dkr.ecr.us-west-1.amazonaws.com" (HTTPS)
  - match:
    - gateways:
      - istio-system/egress-gateway   # Notice the istio-system/ prefix!
      port: 443
      sniHosts:
      - 920425549926.dkr.ecr.us-west-1.amazonaws.com
    route:
    - destination:
        host: 920425549926.dkr.ecr.us-west-1.amazonaws.com
        port:
          number: 443


  # (disabled, because we are using TLS)
