apiVersion: v1
kind: Pod
metadata:
  name: approver
  namespace: sandbox
  # label? think: should this pod be under the default-deny NetworkPolicy?
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
    fsGroup: 2000
  containers:
    - name: approver
      image: busybox:1.36
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - name: approvals
          mountPath: /approvals
  volumes:
    - name: approvals
      persistentVolumeClaim:
        claimName: sandbox-approvals-pvc