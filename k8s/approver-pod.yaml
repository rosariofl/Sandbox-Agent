apiVersion: v1
kind: Pod
metadata:
  name: approver
  labels:
    app: approver
  namespace: sandbox
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  nodeSelector:
    kubernetes.io/hostname: ubuntuserver
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
    fsGroup: 2000
  containers:
    - name: approver
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - name: approvals
          mountPath: /approvals
  volumes:
    - name: approvals
      persistentVolumeClaim:
        claimName: sandbox-approvals-pvc