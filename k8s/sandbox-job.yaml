apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-agent
  namespace: sandbox
spec:
  backoffLimit: 3 # a run that fails — how many auto-retries before stopping?
  activeDeadlineSeconds: 600 # wall-clock ceiling for the whole run
  ttlSecondsAfterFinished: 3600 # auto-delete the finished Job after 1h (cleanup, not safety)
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: agent
          image: 920425549926.dkr.ecr.us-west-1.amazonaws.com/sandbox/sandbox_agent:80cdf2a19c12df1ecc298831621caef71d6f2fce
          env:
            - name: anthropic-api
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: approvals
              mountPath: /app/approvals
      volumes:
        - name: approvals
          emptyDir: {}
