apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-agent
  namespace: sandbox
spec:
  backoffLimit: 3 # a run that fails — how many auto-retries before stopping?
  activeDeadlineSeconds: 600 # wall-clock ceiling for the whole run
  ttlSecondsAfterFinished: 3600 # auto-delete the finished Job after 1h (cleanup, not safety)
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-creds
      nodeSelector:
        kubernetes.io/hostname: ubuntuserver
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 2000
      containers:
        - name: agent
          image: 920425549926.dkr.ecr.us-west-1.amazonaws.com/sandbox/sandbox_agent:c0aae13cde9b6b1cb0fcdadcbe8c78dc6c00d4ce
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: approvals
              mountPath: /app/approvals
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: approvals
          emptyDir: {}
