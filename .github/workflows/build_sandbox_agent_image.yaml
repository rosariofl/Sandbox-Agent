name: sandbox_agent
on:
  workflow_dispatch: # Adds the manual trigger button on GitHub.com
  push:
    branches: [ Development ]
    paths:
      - 'mcp-client.py'
      - 'mcp-server.py'
      - 'Dockerfile'
      - 'requirements.txt'
      # NOTE what's deliberately absent here. It matters. See below.

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: write   # lets the job push the manifest change back to repo.

env:
  AWS_REGION: us-west-1
  ECR_REPO: sandbox/sandbox_agent

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920425549926:role/Github_OIDC_sandbox_agent_role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}    # immutable tag = the seam the whole loop hinges on
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$TAG .
          docker push $REGISTRY/$ECR_REPO:$TAG
          echo "IMAGE=$REGISTRY/$ECR_REPO:$TAG" >> "$GITHUB_ENV"

      - name: Write the new tag back to Git
        run: |
          sed -i "s|image:.*$|image: $IMAGE|g" k8s/sandbox-job.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/sandbox-job.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-deploy: $IMAGE"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "No changes to deploy."
          fi
